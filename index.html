<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0eee9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitap Kulübü">
<title>Kitap Kulübü</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Instrument+Sans:wght@400..700&family=Caveat:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M2 5.5C4 4.3 7 4 12 6c5-2 8-1.7 10-.5V19c-2-1.2-5-1.5-10 .5-5-2-8-1.7-10-.5z"/><path d="M12 6v13.5"/></svg></span>
      <div><b>Kitap Kulübü</b><span>Her ay bir kitap</span></div>
    </div>
    <nav class="snav" id="snav" aria-label="Bölümler"></nav>
    <div class="me" id="me-side"></div>
  </aside>

  <div class="content">
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M2 5.5C4 4.3 7 4 12 6c5-2 8-1.7 10-.5V19c-2-1.2-5-1.5-10 .5-5-2-8-1.7-10-.5z"/><path d="M12 6v13.5"/></svg></span>
        <div><b>Kitap Kulübü</b></div>
      </div>
      <div id="me-top"></div>
    </header>
    <main id="view">
      <div class="skel" aria-label="Kulüp yükleniyor"></div>
    </main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Bölümler"></nav>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
<script>
// Önbellek katmanı: yeni sürüm yayınlanınca sayfa bir kez kendiliğinden yenilenir (ilk kurulumda değil).
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    // Uzun süre açık kalan sekmeler de güncellemeyi yakalasın
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script></body>
</html>
